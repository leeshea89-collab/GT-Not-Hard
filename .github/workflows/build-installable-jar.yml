name: Build installable GT-Not-Hard JAR

on:
  workflow_dispatch:
  push:
    branches: [gtnh-2.9-rc2]
    paths:
      - 'src/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/build-installable-jar.yml'

jobs:
  assemble:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble mod JAR (does not run Spotless)
        run: |
          chmod +x ./gradlew
          ./gradlew assemble --no-daemon --stacktrace
      - name: Select runtime JAR
        run: |
          mkdir -p dist
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' -exec cp '{}' dist/ \;
          test -n "$(ls -A dist)"
          ls -lh dist
      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: GT-Not-Hard-2.9-RC2-JAR
          path: dist/*.jar
          if-no-files-found: error
